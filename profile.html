<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - The Daily Chronicle</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="paper">

    <header>

        <div class="topline">
            Founded 2026 • User-Published Articles
        </div>

        <h1>THE DAILY CHRONICLE</h1>

        <div class="subtitle">
            Author Profile
        </div>

    </header>

    <nav>
        <a href="index.html">← Back to The Daily Chronicle</a>
    </nav>

    <section class="profile-header">

        <div class="profile-picture">
            PROFILE
        </div>

        <div class="profile-info">

            <h2>_Example_</h2>

            <div class="username">
                @example
            </div>

            <div class="joined">
                Joined November 2026
            </div>

            <div class="article-count">
                Articles Published: 0
            </div>

        </div>

    </section>

    <section class="badge-section">

        <h3>Badges</h3>

        <div class="badge-list">

            <div class="badge">
                👑 Founder
            </div>

            <div class="badge">
                📰 Journalist
            </div>

        </div>

    </section>

    <section class="articles-section">

        <h3>Published Articles</h3>

        <article class="profile-article">

            <h4>
                Example Article
            </h4>

            <p>
                Published November 4, 2026
            </p>

        </article>

    </section>

    <!-- ONLY VISIBLE TO DIEGOPROGD LATER -->

    <section class="admin-actions">

        <h3>Owner Actions</h3>

        <button>Grant Badge</button>
        <button>Remove Badge</button>
        <button>Timeout User</button>
        <button>Ban User</button>

    </section>

</div>

</body>
</html>
