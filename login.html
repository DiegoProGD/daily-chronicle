<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - The Daily Chronicle</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="paper">

    <header>

        <div class="topline">
            Founded 2026 • User-Published Articles
        </div>

        <h1>THE DAILY CHRONICLE</h1>

        <div class="subtitle">
            Login
        </div>

    </header>

    <nav>
        <a href="index.html">← Back to The Daily Chronicle</a>
    </nav>

    <div class="auth-container">

        <h2>Sign In</h2>

        <form id="login-form">

            <label>Email</label>

            <input
                id="login-email"
                type="email"
                placeholder="email@example.com"
                required
            >

            <label>Password</label>

            <input
                id="login-password"
                type="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="register.html">
                Register
            </a>
        </p>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>

</body>
</html>
