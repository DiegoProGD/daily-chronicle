<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - The Daily Chronicle</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="paper">

    <header>

        <div class="topline">
            Founded 2026 • User-Published Articles
        </div>

        <h1>THE DAILY CHRONICLE</h1>

        <div class="subtitle">
            Create Account
        </div>

    </header>

    <nav>
        <a href="index.html">← Back to The Daily Chronicle</a>
    </nav>

    <div class="auth-container">

        <h2>Join The Daily Chronicle</h2>

        <form id="register-form">

            <label>Username</label>

            <input
                id="username"
                type="text"
                placeholder="example"
                required
            >

            <small>
                Lowercase letters, numbers, and underscores only.
            </small>

            <label>Display Name</label>

            <input
                id="display-name"
                type="text"
                placeholder="_Example_"
                required
            >

            <label>Email</label>

            <input
                id="email"
                type="email"
                placeholder="email@example.com"
                required
            >

            <label>Password</label>

            <input
                id="password"
                type="password"
                placeholder="Create a password"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>

</body>
</html>
